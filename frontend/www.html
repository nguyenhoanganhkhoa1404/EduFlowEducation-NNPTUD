<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>www.html | EduFlow Entry</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f8fafc; margin: 0; }
        .choice { display: flex; gap: 2rem; margin-top: 2rem; }
        .box { padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: center; width: 200px; text-decoration: none; color: inherit; transition: 0.2s; }
        .box:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border: 2px solid #6366f1; }
        h1 { color: #1e293b; }
    </style>
</head>
<body>
    <h1>Welcome to EduFlow</h1>
    <p>Please choose a frontend version to explore:</p>
    <div class="choice">
        <a href="index.html" class="box">
            <h3 style="color: #6366f1;">React.js</h3>
            <p>Static Legacy / Portal</p>
        </a>
        <a href="vue.html" class="box">
            <h3 style="color: #10b981;">Vue.js</h3>
            <p>CDN Version</p>
        </a>
    </div>
    <div style="margin-top: 4rem; color: #64748b; font-size: 0.9rem;">
        Note: The modern **React + Vite** source is in the <code>/client</code> folder.
    </div>
</body>
</html>
